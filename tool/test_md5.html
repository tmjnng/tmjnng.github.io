<!DOCTYPE html>
<html>
<head>
    <title>MD5 Test</title>
</head>
<body>
    <h1>MD5 Hash Test</h1>
    <div id="test-results"></div>

    <script>
        // 复制修复后的MD5函数
        function md5(string) {
            // 将字符串转换为UTF-8字节数组
            function stringToBytes(str) {
                const bytes = [];
                for (let i = 0; i < str.length; i++) {
                    let char = str.charCodeAt(i);
                    if (char <= 0x7F) {
                        bytes.push(char);
                    } else if (char <= 0x7FF) {
                        bytes.push(0xC0 | (char >> 6));
                        bytes.push(0x80 | (char & 0x3F));
                    } else if (char <= 0xFFFF) {
                        bytes.push(0xE0 | (char >> 12));
                        bytes.push(0x80 | ((char >> 6) & 0x3F));
                        bytes.push(0x80 | (char & 0x3F));
                    } else {
                        bytes.push(0xF0 | (char >> 18));
                        bytes.push(0x80 | ((char >> 12) & 0x3F));
                        bytes.push(0x80 | ((char >> 6) & 0x3F));
                        bytes.push(0x80 | (char & 0x3F));
                    }
                }
                return bytes;
            }
            
            function rotateLeft(value, bits) {
                return ((value << bits) | (value >>> (32 - bits))) & 0xFFFFFFFF;
            }
            
            function add32(x, y) {
                return (x + y) & 0xFFFFFFFF;
            }
            
            // 初始状态
            let a0 = 0x67452301;
            let b0 = 0xefcdab89;
            let c0 = 0x98badcfe;
            let d0 = 0x10325476;
            
            // MD5常量
            const K = [
                0xd76aa478, 0xe8c7b756, 0x242070db, 0xc1bdceee,
                0xf57c0faf, 0x4787c62a, 0xa8304613, 0xfd469501,
                0x698098d8, 0x8b44f7af, 0xffff5bb1, 0x895cd7be,
                0x6b901122, 0xfd987193, 0xa679438e, 0x49b40821,
                0xf61e2562, 0xc040b340, 0x265e5a51, 0xe9b6c7aa,
                0xd62f105d, 0x02441453, 0xd8a1e681, 0xe7d3fbc8,
                0x21e1cde6, 0xc33707d6, 0xf4d50d87, 0x455a14ed,
                0xa9e3e905, 0xfcefa3f8, 0x676f02d9, 0x8d2a4c8a,
                0xfffa3942, 0x8771f681, 0x6d9d6122, 0xfde5380c,
                0xa4beea44, 0x4bdecfa9, 0xf6bb4b60, 0xbebfbc70,
                0x289b7ec6, 0xeaa127fa, 0xd4ef3085, 0x04881d05,
                0xd9d4d039, 0xe6db99e5, 0x1fa27cf8, 0xc4ac5665,
                0xf4292244, 0x432aff97, 0xab9423a7, 0xfc93a039,
                0x655b59c3, 0x8f0ccc92, 0xffeff47d, 0x85845dd1,
                0x6fa87e4f, 0xfe2ce6e0, 0xa3014314, 0x4e0811a1,
                0xf7537e82, 0xbd3af235, 0x2ad7d2bb, 0xeb86d391
            ];
            
            // 旋转位数
            const S = [
                7, 12, 17, 22, 7, 12, 17, 22, 7, 12, 17, 22, 7, 12, 17, 22,
                5, 9, 14, 20, 5, 9, 14, 20, 5, 9, 14, 20, 5, 9, 14, 20,
                4, 11, 16, 23, 4, 11, 16, 23, 4, 11, 16, 23, 4, 11, 16, 23,
                6, 10, 15, 21, 6, 10, 15, 21, 6, 10, 15, 21, 6, 10, 15, 21
            ];
            
            // 步骤1: 填充数据
            const bytes = stringToBytes(string);
            const originalLength = bytes.length * 8;
            
            // 添加1位
            bytes.push(0x80);
            
            // 添加0位，直到长度满足条件
            while ((bytes.length * 8) % 512 !== 448) {
                bytes.push(0x00);
            }
            
            // 添加原始长度（64位）
            for (let i = 0; i < 8; i++) {
                bytes.push((originalLength >>> (i * 8)) & 0xFF);
            }
            
            // 步骤2: 处理512位块
            for (let offset = 0; offset < bytes.length; offset += 64) {
                const M = [];
                for (let i = 0; i < 16; i++) {
                    M[i] = (
                        (bytes[offset + i * 4] & 0xFF) |
                        ((bytes[offset + i * 4 + 1] & 0xFF) << 8) |
                        ((bytes[offset + i * 4 + 2] & 0xFF) << 16) |
                        ((bytes[offset + i * 4 + 3] & 0xFF) << 24)
                    ) & 0xFFFFFFFF;
                }
                
                let A = a0;
                let B = b0;
                let C = c0;
                let D = d0;
                
                // 主循环
                for (let i = 0; i < 64; i++) {
                    let F, g;
                    if (i < 16) {
                        F = (B & C) | (~B & D);
                        g = i;
                    } else if (i < 32) {
                        F = (B & D) | (C & ~D);
                        g = (5 * i + 1) % 16;
                    } else if (i < 48) {
                        F = B ^ C ^ D;
                        g = (3 * i + 5) % 16;
                    } else {
                        F = C ^ (B | ~D);
                        g = (7 * i) % 16;
                    }
                    
                    const temp = D;
                    D = C;
                    C = B;
                    B = add32(B, rotateLeft(add32(add32(add32(A, F), K[i]), M[g]), S[i]));
                    A = temp;
                }
                
                // 更新状态
                a0 = add32(a0, A);
                b0 = add32(b0, B);
                c0 = add32(c0, C);
                d0 = add32(d0, D);
            }
            
            // 步骤3: 转换为十六进制
            function toHex(val) {
                // 确保值是32位无符号整数
                const unsigned = val >>> 0;
                const hex = unsigned.toString(16);
                const padded = hex.padStart(8, '0');
                return padded;
            }
            
            return (
                toHex(a0) +
                toHex(b0) +
                toHex(c0) +
                toHex(d0)
            ).toLowerCase();
        }

        // 测试用例
        const testCases = [
            { input: "hello world", expected: "5eb63bbbe01eeed093cb22bb8f5acdc3" },
            { input: "", expected: "d41d8cd98f00b204e9800998ecf8427e" },
            { input: "123456", expected: "e10adc3949ba59abbe56e057f20f883e" },
            { input: "MD5 encryption", expected: "5c89e4c830e269f49b5501b7e8a648d1" }
        ];

        // 运行测试
        function runTests() {
            const resultsDiv = document.getElementById('test-results');
            let html = '<table border="1" style="border-collapse: collapse; width: 100%;">';
            html += '<tr><th>Input</th><th>Expected</th><th>Actual</th><th>Result</th></tr>';

            let allPassed = true;

            console.log('MD5 Test Results:');
            console.log('================');

            testCases.forEach(testCase => {
                const actual = md5(testCase.input);
                const passed = actual === testCase.expected;
                allPassed = allPassed && passed;

                html += `<tr>`;
                html += `<td>${testCase.input}</td>`;
                html += `<td>${testCase.expected}</td>`;
                html += `<td>${actual}</td>`;
                html += `<td style="color: ${passed ? 'green' : 'red'}">${passed ? '✓ PASS' : '✗ FAIL'}</td>`;
                html += `</tr>`;

                // 控制台输出
                console.log(`Input: "${testCase.input}"`);
                console.log(`Expected: ${testCase.expected}`);
                console.log(`Actual:   ${actual}`);
                console.log(`Result: ${passed ? 'PASS' : 'FAIL'}`);
                console.log('---');
            });

            html += '</table>';
            html += `<h2 style="color: ${allPassed ? 'green' : 'red'}">${allPassed ? 'All tests passed!' : 'Some tests failed!'}</h2>`;
            resultsDiv.innerHTML = html;

            console.log(`Overall: ${allPassed ? 'All tests passed!' : 'Some tests failed!'}`);
        }

        // 页面加载时运行测试
        window.onload = runTests;
    </script>
</body>
</html>
