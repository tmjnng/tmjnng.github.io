<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AES修复验证</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .test-section { margin: 20px 0; padding: 15px; border: 1px solid #ddd; }
        .result { font-family: monospace; white-space: pre; background: #f5f5f5; padding: 10px; margin: 10px 0; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        button { margin: 5px; padding: 8px 16px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>AES修复验证</h1>
    
    <div class="test-section">
        <h2>测试参数</h2>
        <div class="result">
输入文本: #Test12345
密钥: G9w53d6p0Px2u47S
模式: ECB
填充: PKCS#7
期望结果: MKm5uxfA2jWSD07Nql82YA==
        </div>
    </div>
    
    <div class="test-section">
        <h2>验证结果</h2>
        <div id="verify-result" class="result"></div>
        <button onclick="verifyFix()">验证修复</button>
    </div>

    <script>
        // 填充方式实现
        function pkcs7Pad(data, blockSize = 16) {
            const paddingLength = blockSize - (data.length % blockSize);
            const padded = new Uint8Array(data.length + paddingLength);
            padded.set(data);
            for (let i = data.length; i < padded.length; i++) {
                padded[i] = paddingLength;
            }
            return padded;
        }

        // 辅助函数
        function bytesToBase64(bytes) {
            const binaryString = String.fromCharCode(...bytes);
            return window.btoa(binaryString);
        }

        // 修复后的密钥处理
        async function importKey(key, mode) {
            let keyData = new TextEncoder().encode(key);
            
            // 对于非标准长度，优先截断到16字节（AES-128）
            if (keyData.length !== 16 && keyData.length !== 24 && keyData.length !== 32) {
                keyData = keyData.slice(0, 16);
            }
            
            const algorithm = mode === 'gcm' ? 'AES-GCM' : 'AES-CBC';
            
            return await crypto.subtle.importKey(
                'raw',
                keyData,
                algorithm,
                false,
                ['encrypt', 'decrypt']
            );
        }

        async function verifyFix() {
            const resultDiv = document.getElementById('verify-result');
            
            try {
                const input = '#Test12345';
                const key = 'G9w53d6p0Px2u47S';
                const mode = 'ecb';
                
                // 处理输入
                const inputBytes = new TextEncoder().encode(input);
                const paddedInput = pkcs7Pad(inputBytes);
                
                // 处理密钥（修复后的方式）
                const keyData = await importKey(key, mode);
                
                // 加密
                const zeroIV = new Uint8Array(16);
                const encrypted = await crypto.subtle.encrypt(
                    { name: 'AES-CBC', iv: zeroIV },
                    keyData,
                    paddedInput
                );
                
                // 转换结果
                const encryptedBytes = new Uint8Array(encrypted);
                const result = bytesToBase64(encryptedBytes);
                const expected = 'MKm5uxfA2jWSD07Nql82YA==';
                const isSuccess = result === expected;
                
                let output = `加密结果: ${result}\n`;
                output += `期望结果: ${expected}\n`;
                output += `是否匹配: ${isSuccess ? '是' : '否'}\n\n`;
                output += `密钥长度: ${new TextEncoder().encode(key).length} 字节\n`;
                output += `截断后密钥长度: 16 字节\n`;
                output += `输入长度: ${inputBytes.length} 字节\n`;
                output += `填充后长度: ${paddedInput.length} 字节\n`;
                
                resultDiv.innerHTML = output;
                resultDiv.className = `result ${isSuccess ? 'success' : 'error'}`;
                
            } catch (error) {
                resultDiv.innerHTML = `错误: ${error.message}`;
                resultDiv.className = 'result error';
            }
        }
    </script>
</body>
</html>
