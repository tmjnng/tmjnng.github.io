<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AES修复验证</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .result { font-family: monospace; white-space: pre; background: #f5f5f5; padding: 10px; margin: 10px 0; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        button { margin: 5px; padding: 8px 16px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>AES修复验证</h1>
    <div id="result" class="result"></div>
    <button onclick="verifyFix()">验证修复</button>

    <script>
        async function verifyFix() {
            const resultDiv = document.getElementById('result');
            
            try {
                const input = '#Test12345';
                const key = 'G9w53d6p0Px2u47S';
                
                resultDiv.textContent = '正在验证...\n';
                
                // 使用修复后的逻辑（截断为16字节）
                const encoder = new TextEncoder();
                let keyData = encoder.encode(key);
                
                if (keyData.length !== 16 && keyData.length !== 24 && keyData.length !== 32) {
                    keyData = keyData.slice(0, 16);
                }
                
                // 处理输入
                let data = encoder.encode(input);
                
                // PKCS#7填充
                const blockSize = 16;
                const paddingLength = blockSize - (data.length % blockSize);
                const padded = new Uint8Array(data.length + paddingLength);
                padded.set(data);
                for (let i = data.length; i < padded.length; i++) {
                    padded[i] = paddingLength;
                }
                data = padded;
                
                // 导入密钥
                const importedKey = await crypto.subtle.importKey(
                    'raw',
                    keyData,
                    'AES-CBC',
                    false,
                    ['encrypt']
                );
                
                // 加密
                const zeroIV = new Uint8Array(16);
                const encrypted = await crypto.subtle.encrypt(
                    {
                        name: 'AES-CBC',
                        iv: zeroIV
                    },
                    importedKey,
                    data
                );
                
                // 转换结果
                const encryptedBytes = new Uint8Array(encrypted);
                const binaryString = String.fromCharCode(...encryptedBytes);
                const base64Result = window.btoa(binaryString);
                
                let output = `=== 修复验证 ===\n`;
                output += `输入文本: ${input}\n`;
                output += `密钥: ${key}\n`;
                output += `密钥长度: ${encoder.encode(key).length} 字符\n`;
                output += `密钥字节数: ${keyData.length} 字节\n`;
                output += `输入长度: ${encoder.encode(input).length} 字节\n`;
                output += `填充后长度: ${data.length} 字节\n`;
                output += `加密字节长度: ${encryptedBytes.length} 字节\n`;
                output += `加密结果: ${base64Result}\n`;
                output += `结果长度: ${base64Result.length} 字符\n\n`;
                
                output += `=== 期望结果 ===\n`;
                output += `16字节密钥: MKm5uxfA2jWSD07Nql82YA== (24字符)\n`;
                output += `32字节密钥: MKm5uxfA2jWSD07Nql82YBU5FvhGVLWBo55vOc0Cy/Q= (44字符)\n\n`;
                
                const is16Match = base64Result === 'MKm5uxfA2jWSD07Nql82YA==';
                const is32Match = base64Result === 'MKm5uxfA2jWSD07Nql82YBU5FvhGVLWBo55vOc0Cy/Q=';
                
                output += `=== 匹配结果 ===\n`;
                output += `匹配16字节: ${is16Match ? '✅' : '❌'}\n`;
                output += `匹配32字节: ${is32Match ? '✅' : '❌'}\n\n`;
                
                output += `=== 结论 ===\n`;
                if (is16Match) {
                    output += `✅ 修复正确！使用16字节密钥\n`;
                } else if (is32Match) {
                    output += `❌ 仍然使用32字节密钥\n`;
                } else {
                    output += `❌ 结果不匹配任何期望值\n`;
                }
                
                resultDiv.innerHTML = output;
                resultDiv.className = `result ${is16Match ? 'success' : 'error'}`;
                
            } catch (error) {
                resultDiv.innerHTML = `错误: ${error.message}\n${error.stack}`;
                resultDiv.className = 'result error';
            }
        }
    </script>
</body>
</html>
