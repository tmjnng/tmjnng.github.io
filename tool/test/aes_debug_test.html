<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AES加密详细测试</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .test-section { margin: 20px 0; padding: 15px; border: 1px solid #ddd; }
        .result { font-family: monospace; white-space: pre; background: #f5f5f5; padding: 10px; margin: 10px 0; }
        .error { color: red; }
        .success { color: green; }
        button { margin: 5px; padding: 8px 16px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>AES加密详细测试</h1>
    
    <div class="test-section">
        <h2>测试参数</h2>
        <div class="result">
输入文本: #Test12345
密钥: G9w53d6p0Px2u47S
模式: ECB
填充: PKCS#7
期望结果: MKm5uxfA2jWSD07Nql82YA==
        </div>
    </div>
    
    <div class="test-section">
        <h2>详细分析</h2>
        <div id="analysis-result" class="result"></div>
        <button onclick="runAnalysis()">运行分析</button>
    </div>
    
    <div class="test-section">
        <h2>加密测试</h2>
        <div id="encryption-result" class="result"></div>
        <button onclick="testEncryption()">测试加密</button>
    </div>

    <script>
        // 填充方式实现
        function pkcs7Pad(data, blockSize = 16) {
            const paddingLength = blockSize - (data.length % blockSize);
            const padded = new Uint8Array(data.length + paddingLength);
            padded.set(data);
            for (let i = data.length; i < padded.length; i++) {
                padded[i] = paddingLength;
            }
            return padded;
        }

        // 辅助函数
        function bytesToBase64(bytes) {
            const binaryString = String.fromCharCode(...bytes);
            return window.btoa(binaryString);
        }

        function hexToBytes(hex) {
            hex = hex.replace(/\s/g, '');
            const length = hex.length / 2;
            const bytes = new Uint8Array(length);
            for (let i = 0; i < length; i++) {
                bytes[i] = parseInt(hex.substr(i * 2, 2), 16);
            }
            return bytes;
        }

        async function importKey(key, mode) {
            // 处理密钥长度
            let keyData = new TextEncoder().encode(key);
            
            console.log('原始密钥长度:', keyData.length);
            console.log('原始密钥:', Array.from(keyData));
            
            // 确保密钥长度符合AES要求
            if (keyData.length !== 16 && keyData.length !== 24 && keyData.length !== 32) {
                if (keyData.length < 16) {
                    const padded = new Uint8Array(16);
                    padded.set(keyData);
                    const paddingLength = 16 - keyData.length;
                    for (let i = keyData.length; i < 16; i++) {
                        padded[i] = paddingLength;
                    }
                    keyData = padded;
                } else if (keyData.length < 24) {
                    const padded = new Uint8Array(24);
                    padded.set(keyData);
                    const paddingLength = 24 - keyData.length;
                    for (let i = keyData.length; i < 24; i++) {
                        padded[i] = paddingLength;
                    }
                    keyData = padded;
                } else if (keyData.length < 32) {
                    const padded = new Uint8Array(32);
                    padded.set(keyData);
                    const paddingLength = 32 - keyData.length;
                    for (let i = keyData.length; i < 32; i++) {
                        padded[i] = paddingLength;
                    }
                    keyData = padded;
                } else {
                    keyData = keyData.slice(0, 32);
                }
            }
            
            console.log('处理后密钥长度:', keyData.length);
            console.log('处理后密钥:', Array.from(keyData));
            
            const algorithm = mode === 'gcm' ? 'AES-GCM' : 'AES-CBC';
            
            return await crypto.subtle.importKey(
                'raw',
                keyData,
                algorithm,
                false,
                ['encrypt', 'decrypt']
            );
        }

        async function runAnalysis() {
            const resultDiv = document.getElementById('analysis-result');
            let result = '';
            
            try {
                // 分析输入文本
                const input = '#Test12345';
                const inputBytes = new TextEncoder().encode(input);
                result += `输入文本: ${input}\n`;
                result += `输入长度: ${inputBytes.length} 字节\n`;
                result += `输入字节: ${Array.from(inputBytes)}\n\n`;
                
                // 分析密钥
                const key = 'G9w53d6p0Px2u47S';
                const keyBytes = new TextEncoder().encode(key);
                result += `密钥: ${key}\n`;
                result += `密钥长度: ${keyBytes.length} 字节\n`;
                result += `密钥字节: ${Array.from(keyBytes)}\n\n`;
                
                // 分析填充
                const paddedInput = pkcs7Pad(inputBytes);
                result += `填充后长度: ${paddedInput.length} 字节\n`;
                result += `填充后字节: ${Array.from(paddedInput)}\n`;
                result += `填充长度: ${paddedInput.length - inputBytes.length} 字节\n\n`;
                
                // 分析密钥处理
                const processedKey = await importKey(key, 'ecb');
                result += `密钥处理: 完成\n`;
                result += `密钥长度是否标准: ${keyBytes.length === 16 || keyBytes.length === 24 || keyBytes.length === 32 ? '是' : '否'}\n`;
                
                resultDiv.innerHTML = result;
            } catch (error) {
                resultDiv.innerHTML = `错误: ${error.message}`;
                resultDiv.className = 'result error';
            }
        }

        async function testEncryption() {
            const resultDiv = document.getElementById('encryption-result');
            let result = '';
            
            try {
                const input = '#Test12345';
                const key = 'G9w53d6p0Px2u47S';
                const mode = 'ecb';
                
                // 处理输入数据
                const data = new TextEncoder().encode(input);
                const paddedData = pkcs7Pad(data);
                
                // 处理密钥
                const keyBytes = await importKey(key, mode);
                
                // 加密
                const zeroIV = new Uint8Array(16);
                const encrypted = await crypto.subtle.encrypt(
                    {
                        name: 'AES-CBC',
                        iv: zeroIV
                    },
                    keyBytes,
                    paddedData
                );
                
                // 转换结果
                const encryptedBytes = new Uint8Array(encrypted);
                const base64Result = bytesToBase64(encryptedBytes);
                
                result += `加密结果: ${base64Result}\n`;
                result += `期望结果: MKm5uxfA2jWSD07Nql82YA==\n`;
                result += `是否匹配: ${base64Result === 'MKm5uxfA2jWSD07Nql82YA==' ? '是' : '否'}\n\n`;
                result += `加密字节: ${Array.from(encryptedBytes)}\n`;
                result += `加密长度: ${encryptedBytes.length} 字节\n`;
                
                resultDiv.innerHTML = result;
                if (base64Result === 'MKm5uxfA2jWSD07Nql82YA==') {
                    resultDiv.className = 'result success';
                } else {
                    resultDiv.className = 'result error';
                }
                
            } catch (error) {
                resultDiv.innerHTML = `错误: ${error.message}`;
                resultDiv.className = 'result error';
            }
        }
    </script>
</body>
</html>
