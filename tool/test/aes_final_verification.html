<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AES最终验证</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .result { font-family: monospace; white-space: pre; background: #f5f5f5; padding: 10px; margin: 10px 0; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
    </style>
</head>
<body>
    <h1>AES最终验证</h1>
    <div id="final-result" class="result"></div>

    <script>
        // 立即执行测试
        (async function() {
            const resultDiv = document.getElementById('final-result');
            
            try {
                // 测试参数
                const tests = [
                    {
                        input: '#Test12345',
                        key: 'G9w53d6p0Px2u47S',
                        expected: 'MKm5uxfA2jWSD07Nql82YA==',
                        name: '测试1'
                    },
                    {
                        input: '#Test123456',
                        key: 'G9w53d6p0Px2u47S',
                        expected: 'j4turEZU6bnHlYxjJ+VINA==',
                        name: '测试2'
                    }
                ];
                
                let output = '';
                
                for (const test of tests) {
                    output += `=== ${test.name} ===\n`;
                    output += `输入文本: ${test.input}\n`;
                    output += `输入长度: ${new TextEncoder().encode(test.input).length} 字节\n`;
                    output += `密钥: ${test.key}\n`;
                    output += `密钥长度: ${new TextEncoder().encode(test.key).length} 字节\n`;
                    
                    // 1. 处理输入数据
                    const encoder = new TextEncoder();
                    let data = encoder.encode(test.input);
                    
                    // 2. PKCS#7填充
                    const blockSize = 16;
                    const paddingLength = blockSize - (data.length % blockSize);
                    const padded = new Uint8Array(data.length + paddingLength);
                    padded.set(data);
                    for (let i = data.length; i < padded.length; i++) {
                        padded[i] = paddingLength;
                    }
                    data = padded;
                    
                    output += `填充后长度: ${data.length} 字节\n`;
                    output += `填充长度: ${paddingLength} 字节\n`;
                    
                    // 3. 处理密钥 - 确保16字节
                    let keyData = encoder.encode(test.key);
                    if (keyData.length !== 16) {
                        keyData = keyData.slice(0, 16);
                    }
                    output += `处理后密钥长度: ${keyData.length} 字节\n`;
                    
                    // 4. 导入密钥
                    const importedKey = await crypto.subtle.importKey(
                        'raw',
                        keyData,
                        'AES-CBC',
                        false,
                        ['encrypt']
                    );
                    
                    // 5. 使用CBC模式模拟ECB（全零IV）
                    const zeroIV = new Uint8Array(16);
                    const encrypted = await crypto.subtle.encrypt(
                        {
                            name: 'AES-CBC',
                            iv: zeroIV
                        },
                        importedKey,
                        data
                    );
                    
                    // 6. 转换为Base64
                    const encryptedBytes = new Uint8Array(encrypted);
                    const binaryString = String.fromCharCode(...encryptedBytes);
                    const base64Result = window.btoa(binaryString);
                    
                    const isCorrect = base64Result === test.expected;
                    
                    output += `加密结果: ${base64Result}\n`;
                    output += `期望结果: ${test.expected}\n`;
                    output += `是否正确: ${isCorrect ? '✅' : '❌'}\n\n`;
                }
                
                resultDiv.innerHTML = output;
                resultDiv.className = 'result success';
                
            } catch (error) {
                resultDiv.innerHTML = `错误: ${error.message}\n${error.stack}`;
                resultDiv.className = 'result error';
            }
        })();
    </script>
</body>
</html>
