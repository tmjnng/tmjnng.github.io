<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AES最终验证</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .test-section { margin: 20px 0; padding: 15px; border: 1px solid #ddd; }
        .result { font-family: monospace; white-space: pre; background: #f5f5f5; padding: 10px; margin: 10px 0; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        button { margin: 5px; padding: 8px 16px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>AES最终验证</h1>
    
    <div class="test-section">
        <h2>测试参数</h2>
        <div class="result">
输入文本: #Test12345
密钥: G9w53d6p0Px2u47S
模式: ECB
填充: PKCS#7
期望结果: MKm5uxfA2jWSD07Nql82YA==
        </div>
    </div>
    
    <div class="test-section">
        <h2>验证结果</h2>
        <div id="final-result" class="result"></div>
        <button onclick="testFinalEncryption()">测试最终加密</button>
    </div>

    <script>
        // 最终修复后的AES加密逻辑
        async function testFinalEncryption() {
            const resultDiv = document.getElementById('final-result');
            
            try {
                const input = '#Test12345';
                const key = 'G9w53d6p0Px2u47S';
                
                // 1. 处理输入数据
                const encoder = new TextEncoder();
                let data = encoder.encode(input);
                
                // 2. PKCS#7填充
                const blockSize = 16;
                const paddingLength = blockSize - (data.length % blockSize);
                const padded = new Uint8Array(data.length + paddingLength);
                padded.set(data);
                for (let i = data.length; i < padded.length; i++) {
                    padded[i] = paddingLength;
                }
                data = padded;
                
                // 3. 处理密钥 - 截断到16字节（关键修复）
                let keyData = encoder.encode(key);
                if (keyData.length !== 16) {
                    keyData = keyData.slice(0, 16);
                }
                
                // 4. 导入密钥
                const importedKey = await crypto.subtle.importKey(
                    'raw',
                    keyData,
                    'AES-CBC',
                    false,
                    ['encrypt']
                );
                
                // 5. 使用CBC模式模拟ECB（全零IV）
                const zeroIV = new Uint8Array(16);
                const encrypted = await crypto.subtle.encrypt(
                    {
                        name: 'AES-CBC',
                        iv: zeroIV
                    },
                    importedKey,
                    data
                );
                
                // 6. 转换为Base64
                const encryptedBytes = new Uint8Array(encrypted);
                const binaryString = String.fromCharCode(...encryptedBytes);
                const base64Result = window.btoa(binaryString);
                
                const expected = 'MKm5uxfA2jWSD07Nql82YA==';
                const isSuccess = base64Result === expected;
                
                let output = `输入文本: ${input}\n`;
                output += `密钥: ${key}\n`;
                output += `密钥长度: ${encoder.encode(key).length} 字节\n`;
                output += `截断后密钥长度: ${keyData.length} 字节\n`;
                output += `输入长度: ${encoder.encode(input).length} 字节\n`;
                output += `填充后长度: ${data.length} 字节\n\n`;
                output += `加密结果: ${base64Result}\n`;
                output += `期望结果: ${expected}\n`;
                output += `是否匹配: ${isSuccess ? '是' : '否'}\n`;
                
                resultDiv.innerHTML = output;
                resultDiv.className = `result ${isSuccess ? 'success' : 'error'}`;
                
            } catch (error) {
                resultDiv.innerHTML = `错误: ${error.message}\n${error.stack}`;
                resultDiv.className = 'result error';
            }
        }
    </script>
</body>
</html>
