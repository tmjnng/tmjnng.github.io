<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>密钥处理测试</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .test-section { margin: 20px 0; padding: 15px; border: 1px solid #ddd; }
        .result { font-family: monospace; white-space: pre; background: #f5f5f5; padding: 10px; margin: 10px 0; }
        button { margin: 5px; padding: 8px 16px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>密钥处理测试</h1>
    
    <div class="test-section">
        <h2>测试不同密钥处理方式</h2>
        <div id="key-test-result" class="result"></div>
        <button onclick="testKeyHandling()">测试密钥处理</button>
    </div>

    <script>
        // 辅助函数
        function bytesToBase64(bytes) {
            const binaryString = String.fromCharCode(...bytes);
            return window.btoa(binaryString);
        }

        function pkcs7Pad(data, blockSize = 16) {
            const paddingLength = blockSize - (data.length % blockSize);
            const padded = new Uint8Array(data.length + paddingLength);
            padded.set(data);
            for (let i = data.length; i < padded.length; i++) {
                padded[i] = paddingLength;
            }
            return padded;
        }

        // 测试不同的密钥处理方式
        async function testKeyHandling() {
            const resultDiv = document.getElementById('key-test-result');
            let result = '';
            
            const input = '#Test12345';
            const key = 'G9w53d6p0Px2u47S';
            
            try {
                // 处理输入
                const inputBytes = new TextEncoder().encode(input);
                const paddedInput = pkcs7Pad(inputBytes);
                
                // 测试1: 当前实现（填充到24字节）
                result += '=== 测试1: 当前实现（填充到24字节）===\n';
                let keyData1 = new TextEncoder().encode(key);
                if (keyData1.length < 24) {
                    const padded = new Uint8Array(24);
                    padded.set(keyData1);
                    const paddingLength = 24 - keyData1.length;
                    for (let i = keyData1.length; i < 24; i++) {
                        padded[i] = paddingLength;
                    }
                    keyData1 = padded;
                }
                result += `密钥长度: ${keyData1.length} 字节\n`;
                result += `密钥字节: ${Array.from(keyData1)}\n`;
                
                const key1 = await crypto.subtle.importKey(
                    'raw',
                    keyData1,
                    'AES-CBC',
                    false,
                    ['encrypt', 'decrypt']
                );
                
                const zeroIV = new Uint8Array(16);
                const encrypted1 = await crypto.subtle.encrypt(
                    { name: 'AES-CBC', iv: zeroIV },
                    key1,
                    paddedInput
                );
                const result1 = bytesToBase64(new Uint8Array(encrypted1));
                result += `加密结果: ${result1}\n\n`;
                
                // 测试2: 截断到16字节
                result += '=== 测试2: 截断到16字节 ===\n';
                const keyData2 = new TextEncoder().encode(key).slice(0, 16);
                result += `密钥长度: ${keyData2.length} 字节\n`;
                result += `密钥字节: ${Array.from(keyData2)}\n`;
                
                const key2 = await crypto.subtle.importKey(
                    'raw',
                    keyData2,
                    'AES-CBC',
                    false,
                    ['encrypt', 'decrypt']
                );
                
                const encrypted2 = await crypto.subtle.encrypt(
                    { name: 'AES-CBC', iv: zeroIV },
                    key2,
                    paddedInput
                );
                const result2 = bytesToBase64(new Uint8Array(encrypted2));
                result += `加密结果: ${result2}\n\n`;
                
                // 测试3: 填充到16字节
                result += '=== 测试3: 填充到16字节 ===\n';
                let keyData3 = new TextEncoder().encode(key);
                if (keyData3.length < 16) {
                    const padded = new Uint8Array(16);
                    padded.set(keyData3);
                    const paddingLength = 16 - keyData3.length;
                    for (let i = keyData3.length; i < 16; i++) {
                        padded[i] = paddingLength;
                    }
                    keyData3 = padded;
                } else if (keyData3.length > 16) {
                    keyData3 = keyData3.slice(0, 16);
                }
                result += `密钥长度: ${keyData3.length} 字节\n`;
                result += `密钥字节: ${Array.from(keyData3)}\n`;
                
                const key3 = await crypto.subtle.importKey(
                    'raw',
                    keyData3,
                    'AES-CBC',
                    false,
                    ['encrypt', 'decrypt']
                );
                
                const encrypted3 = await crypto.subtle.encrypt(
                    { name: 'AES-CBC', iv: zeroIV },
                    key3,
                    paddedInput
                );
                const result3 = bytesToBase64(new Uint8Array(encrypted3));
                result += `加密结果: ${result3}\n\n`;
                
                // 期望结果
                result += '=== 期望结果 ===\n';
                result += '期望结果: MKm5uxfA2jWSD07Nql82YA==\n';
                
                resultDiv.innerHTML = result;
                
            } catch (error) {
                resultDiv.innerHTML = `错误: ${error.message}`;
            }
        }
    </script>
</body>
</html>
