<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>开发工具集</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/typeface-source-code-pro@0.0.71/index.min.css">
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .tool-container {
      margin: 50px 0;
    }
    .tool-header {
      text-align: center;
      margin-bottom: 30px;
    }
    .tool-header h1 {
      font-size: 2.5em;
      color: #333;
      margin-bottom: 10px;
    }
    .tool-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
      margin: 0 20px;
    }
    .tool-card {
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      padding: 20px;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }
    .tool-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 5px 15px rgba(0,0,0,0.15);
    }
    .tool-card h3 {
      color: #258fb8;
      margin-bottom: 15px;
      font-size: 1.3em;
    }
    .tool-card textarea {
      width: 100%;
      min-height: 120px;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-family: "Source Code Pro", Consolas, Monaco, Menlo, Consolas, monospace;
      font-size: 14px;
      resize: vertical;
      margin-bottom: 10px;
    }
    .tool-card input {
      width: 100%;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 4px;
      margin-bottom: 10px;
      font-size: 14px;
    }
    .tool-card select {
      width: 100%;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 4px;
      margin-bottom: 10px;
      font-size: 14px;
    }
    .tool-buttons {
      display: flex;
      gap: 10px;
      margin-bottom: 10px;
    }
    .tool-buttons button {
      flex: 1;
      padding: 10px;
      background: #258fb8;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
      transition: background 0.3s ease;
    }
    .tool-buttons button:hover {
      background: #1e7293;
    }
    .tool-result {
      background: #f5f5f5;
      border: 1px solid #ddd;
      border-radius: 4px;
      padding: 10px;
      min-height: 80px;
      font-family: "Source Code Pro", Consolas, Monaco, Menlo, Consolas, monospace;
      font-size: 14px;
      white-space: pre-wrap;
      word-break: break-all;
    }
    .copy-btn {
      padding: 8px 15px;
      background: #5cb85c;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
      margin-bottom: 10px;
    }
    .copy-btn:hover {
      background: #4cae4c;
    }
  </style>
</head>

        <div id="header-outer" class="outer">
          <div id="header-title" class="inner">
            <h1 id="logo-wrap">
              <a href="/" id="logo">开发工具集</a>
            </h1>
          </div>
          <div id="header-inner" class="inner">

              <a id="main-nav-toggle" class="nav-icon"></a>

              <a class="main-nav-link" href="/tool/index.html">工具集</a>
            </nav>
            <nav id="sub-nav">
              <select id="language-selector" style="margin-right: 15px; padding: 5px; border: 1px solid #ddd; border-radius: 3px;">

                <option value="zh">中文</option>
                <option value="ja">日本語</option>

            </nav>

            </div>
          </div>
        </div>

        <section id="main">
          <div class="tool-container">
            <div class="tool-header">
              <h1>开发工具集</h1>

            </div>

            <div class="tool-grid">
              <!-- JSON格式化工具 -->
              <div class="tool-card">
                <h3>JSON格式化</h3>
                <textarea id="json-input" placeholder="请输入JSON字符串..."></textarea>
                <div class="tool-buttons">
                  <button onclick="formatJson()">格式化</button>
                  <button onclick="minifyJson()">压缩</button>
                </div>
                <button class="copy-btn" onclick="copyResult('json-result')">复制结果</button>
                <div id="json-result" class="tool-result"></div>
              </div>

              <!-- XML格式化工具 -->
              <div class="tool-card">
                <h3>XML格式化</h3>
                <textarea id="xml-input" placeholder="请输入XML字符串..."></textarea>
                <div class="tool-buttons">
                  <button onclick="formatXml()">格式化</button>
                  <button onclick="minifyXml()">压缩</button>
                </div>
                <button class="copy-btn" onclick="copyResult('xml-result')">复制结果</button>
                <div id="xml-result" class="tool-result"></div>
              </div>

              <!-- MD5加密工具 -->
              <div class="tool-card">
                <h3>MD5加密</h3>
                <input type="text" id="md5-input" placeholder="请输入要加密的文本...">
                <div class="tool-buttons">
                  <button onclick="md5Encrypt()">加密</button>
                </div>
                <button class="copy-btn" onclick="copyResult('md5-result')">复制结果</button>
                <div id="md5-result" class="tool-result"></div>
              </div>

              <!-- AES加密解密工具 -->
              <div class="tool-card">
                <h3>AES加密解密</h3>
                <input type="text" id="aes-key" placeholder="密钥 (16/24/32位)">
                <input type="text" id="aes-input" placeholder="请输入要加密/解密的文本...">
                <select id="aes-mode">
                  <option value="CBC">CBC模式</option>
                  <option value="ECB">ECB模式</option>
                </select>
                <div class="tool-buttons">
                  <button onclick="aesEncrypt()">加密</button>
                  <button onclick="aesDecrypt()">解密</button>
                </div>
                <button class="copy-btn" onclick="copyResult('aes-result')">复制结果</button>
                <div id="aes-result" class="tool-result"></div>
              </div>

              <!-- Base64编码解码工具 -->
              <div class="tool-card">
                <h3>Base64编码解码</h3>
                <textarea id="base64-input" placeholder="请输入要编码/解码的内容..."></textarea>
                <div class="tool-buttons">
                  <button onclick="base64Encode()">编码</button>
                  <button onclick="base64Decode()">解码</button>
                </div>
                <button class="copy-btn" onclick="copyResult('base64-result')">复制结果</button>
                <div id="base64-result" class="tool-result"></div>
              </div>

              <!-- URL编码解码工具 -->
              <div class="tool-card">
                <h3>URL编码解码</h3>
                <input type="text" id="url-input" placeholder="请输入要编码/解码的URL...">
                <div class="tool-buttons">
                  <button onclick="urlEncode()">编码</button>
                  <button onclick="urlDecode()">解码</button>
                </div>
                <button class="copy-btn" onclick="copyResult('url-result')">复制结果</button>
                <div id="url-result" class="tool-result"></div>
              </div>

              <!-- 时间戳转换工具 -->
              <div class="tool-card">
                <h3>时间戳转换</h3>
                <input type="text" id="timestamp-input" placeholder="请输入时间戳或日期...">
                <div class="tool-buttons">
                  <button onclick="timestampToDate()">时间戳→日期</button>
                  <button onclick="dateToTimestamp()">日期→时间戳</button>
                </div>
                <button class="copy-btn" onclick="copyResult('timestamp-result')">复制结果</button>
                <div id="timestamp-result" class="tool-result"></div>
              </div>

              <!-- 颜色转换工具 -->
              <div class="tool-card">
                <h3>颜色转换</h3>
                <input type="text" id="color-input" placeholder="请输入颜色值 (#RRGGBB)...">
                <div class="tool-buttons">
                  <button onclick="hexToRgb()">HEX→RGB</button>
                  <button onclick="rgbToHex()">RGB→HEX</button>
                </div>
                <button class="copy-btn" onclick="copyResult('color-result')">复制结果</button>
                <div id="color-result" class="tool-result"></div>
              </div>
            </div>
          </div>
        </section>
      </div>

      <footer id="footer">
        <div class="outer">

            &copy; 2026 开发工具集<br>

          </div>

    </div>

          langData.urlTool,
          langData.timestampTool,
          langData.colorTool

      // XML格式化工具
      function formatXml() {
        const input = document.getElementById('xml-input').value;
        const result = document.getElementById('xml-result');
        const langData = i18n[currentLang];
        try {
          const xmlDoc = new DOMParser().parseFromString(input, 'text/xml');
          if (xmlDoc.getElementsByTagName('parsererror').length) {
            throw new Error(langData.xmlError);
          }
          const serializer = new XMLSerializer();
          let formatted = serializer.serializeToString(xmlDoc);
          formatted = formatted.replace(/></g, '>\n<');
          
          // 添加缩进
          let indent = 0;
          const lines = formatted.split('\n');
          const formattedLines = [];
          
          for (let line of lines) {
            line = line.trim();
            if (line === '') continue;
            
            if (line.startsWith('</')) {
              indent--;
            }
            
            formattedLines.push('  '.repeat(indent) + line);
            
            if (line.startsWith('<') && !line.startsWith('</') && !line.endsWith('/>')) {
              indent++;
            }
          }
          
          result.textContent = formattedLines.join('\n');
          result.style.color = '#333';
        } catch (e) {
          result.textContent = langData.xmlError + ': ' + e.message;
          result.style.color = '#f2777a';
        }
      }

      // MD5加密工具

      // MD5算法实现
      function md5(string) {
        function RotateLeft(lValue, iShiftBits) {
          return (lValue << iShiftBits) | (lValue >>> (32 - iShiftBits));
        }

        function AddUnsigned(lX, lY) {
          const lX4 = lX & 0x40000000;
          const lY4 = lY & 0x40000000;
          const lX8 = lX & 0x80000000;
          const lY8 = lY & 0x80000000;
          const lResult = (lX & 0x3FFFFFFF) + (lY & 0x3FFFFFFF);
          if (lX4 & lY4) {
            return (lResult ^ 0x80000000 ^ lX8 ^ lY8);
          }
          if (lX4 | lY4) {
            if (lResult & 0x40000000) {
              return (lResult ^ 0xC0000000 ^ lX8 ^ lY8);
            } else {
              return (lResult ^ 0x40000000 ^ lX8 ^ lY8);
            }
          } else {
            return (lResult ^ lX8 ^ lY8);
          }
        }

        function F(x, y, z) {
          return (x & y) | ((~x) & z);
        }

        function G(x, y, z) {
          return (x & z) | (y & (~z));
        }

        function H(x, y, z) {
          return (x ^ y ^ z);
        }

        function I(x, y, z) {
          return (y ^ (x | (~z)));
        }

        function FF(a, b, c, d, x, s, ac) {
          a = AddUnsigned(a, AddUnsigned(AddUnsigned(F(b, c, d), x), ac));
          return AddUnsigned(RotateLeft(a, s), b);
        }

        function GG(a, b, c, d, x, s, ac) {
          a = AddUnsigned(a, AddUnsigned(AddUnsigned(G(b, c, d), x), ac));
          return AddUnsigned(RotateLeft(a, s), b);
        }

        function HH(a, b, c, d, x, s, ac) {
          a = AddUnsigned(a, AddUnsigned(AddUnsigned(H(b, c, d), x), ac));
          return AddUnsigned(RotateLeft(a, s), b);
        }

        function II(a, b, c, d, x, s, ac) {
          a = AddUnsigned(a, AddUnsigned(AddUnsigned(I(b, c, d), x), ac));
          return AddUnsigned(RotateLeft(a, s), b);
        }

        function ConvertToWordArray(string) {
          const lWordCount = string.length >> 2;
          const lRemainingChars = string.length & 3;
          const lWordArray = [];
          let lBytePosition = 0;
          let lByteCount = 0;
          while (lByteCount < lWordCount) {
            lWordArray[lByteCount++] = (string.charCodeAt(lBytePosition) | (string.charCodeAt(lBytePosition + 1) << 8) | (string.charCodeAt(lBytePosition + 2) << 16) | (string.charCodeAt(lBytePosition + 3) << 24));
            lBytePosition += 4;
          }
          switch (lRemainingChars) {
            case 3:
              lWordArray[lByteCount++] = (string.charCodeAt(lBytePosition) | (string.charCodeAt(lBytePosition + 1) << 8) | (string.charCodeAt(lBytePosition + 2) << 16) | (0 << 24));
              break;
            case 2:
              lWordArray[lByteCount++] = (string.charCodeAt(lBytePosition) | (string.charCodeAt(lBytePosition + 1) << 8) | (0 << 16) | (0 << 24));
              break;
            case 1:
              lWordArray[lByteCount++] = (string.charCodeAt(lBytePosition) | (0 << 8) | (0 << 16) | (0 << 24));
              break;
          }
          return lWordArray;
        }

        function WordToHex(lValue) {
          const WordToHexValue = "0123456789abcdef";
          let lHexValue = "";
          for (let i = 0; i <= 3; i++) {
            lHexValue += WordToHexValue.charAt((lValue >> (i * 8 + 4)) & 0x0F) + WordToHexValue.charAt((lValue >> (i * 8)) & 0x0F);
          }
          return lHexValue;
        }

        let x = ConvertToWordArray(string);
        let a = 0x67452301;
        let b = 0xEFCDAB89;
        let c = 0x98BADCFE;
        let d = 0x10325476;
        let olda = a;
        let oldb = b;
        let oldc = c;
        let oldd = d;

        const k = [
          0xD76AA478, 0xE8C7B756, 0x242070DB, 0xC1BDCEEE,
          0xF57C0FAF, 0x4787C62A, 0xA8304613, 0xFD469501,
          0x698098D8, 0x8B44F7AF, 0xFFFF5BB1, 0x895CD7BE,
          0x6B901122, 0xFD987193, 0xA679438E, 0x49B40821,
          0xF61E2562, 0xC040B340, 0x265E5A51, 0xE9B6C7AA,
          0xD62F105D, 0x02441453, 0xD8A1E681, 0xE7D3FBC8,
          0x21E1CDE6, 0xC33707D6, 0xF4D50D87, 0x455A14ED,
          0xA9E3E905, 0xFCEFA3F8, 0x676F02D9, 0x8D2A4C8A,
          0xFFFA3942, 0x8771F681, 0x6D9D6122, 0xFDE5380C,
          0xA4BEEA44, 0x4BDECFA9, 0xF6BB4B60, 0xBEBFBC70,
          0x289B7EC6, 0xEAA127FA, 0xD4EF3085, 0x04881D05,
          0xD9D4D039, 0xE6DB99E5, 0x1FA27CF8, 0xC4AC5665,
          0xF4292244, 0x432AFF97, 0xAB9423A7, 0xFC93A039,
          0x655B59C3, 0x8F0CCC92, 0xFFEFF47D, 0x85845DD1,
          0x6FA87E4F, 0xFE2CE6E0, 0xA3014314, 0x4E0811A1,
          0xF7537E82, 0xBD3AF235, 0x2AD7D2BB, 0xEB86D391
        ];

        const s = [
          7, 12, 17, 22, 7, 12, 17, 22, 7, 12, 17, 22, 7, 12, 17, 22,
          5, 9, 14, 20, 5, 9, 14, 20, 5, 9, 14, 20, 5, 9, 14, 20,
          4, 11, 16, 23, 4, 11, 16, 23, 4, 11, 16, 23, 4, 11, 16, 23,
          6, 10, 15, 21, 6, 10, 15, 21, 6, 10, 15, 21, 6, 10, 15, 21
        ];

        for (let i = 0; i < x.length; i += 16) {
          let aa = a;
          let bb = b;
          let cc = c;
          let dd = d;

          aa = FF(aa, bb, cc, dd, x[i + 0], s[0], k[0]);
          dd = FF(dd, aa, bb, cc, x[i + 1], s[1], k[1]);
          cc = FF(cc, dd, aa, bb, x[i + 2], s[2], k[2]);
          bb = FF(bb, cc, dd, aa, x[i + 3], s[3], k[3]);
          aa = FF(aa, bb, cc, dd, x[i + 4], s[4], k[4]);
          dd = FF(dd, aa, bb, cc, x[i + 5], s[5], k[5]);
          cc = FF(cc, dd, aa, bb, x[i + 6], s[6], k[6]);
          bb = FF(bb, cc, dd, aa, x[i + 7], s[7], k[7]);
          aa = FF(aa, bb, cc, dd, x[i + 8], s[8], k[8]);
          dd = FF(dd, aa, bb, cc, x[i + 9], s[9], k[9]);
          cc = FF(cc, dd, aa, bb, x[i + 10], s[10], k[10]);
          bb = FF(bb, cc, dd, aa, x[i + 11], s[11], k[11]);
          aa = FF(aa, bb, cc, dd, x[i + 12], s[12], k[12]);
          dd = FF(dd, aa, bb, cc, x[i + 13], s[13], k[13]);
          cc = FF(cc, dd, aa, bb, x[i + 14], s[14], k[14]);
          bb = FF(bb, cc, dd, aa, x[i + 15], s[15], k[15]);

          aa = GG(aa, bb, cc, dd, x[i + 1], s[16], k[16]);
          dd = GG(dd, aa, bb, cc, x[i + 6], s[17], k[17]);
          cc = GG(cc, dd, aa, bb, x[i + 11], s[18], k[18]);
          bb = GG(bb, cc, dd, aa, x[i + 0], s[19], k[19]);
          aa = GG(aa, bb, cc, dd, x[i + 5], s[20], k[20]);
          dd = GG(dd, aa, bb, cc, x[i + 10], s[21], k[21]);
          cc = GG(cc, dd, aa, bb, x[i + 15], s[22], k[22]);
          bb = GG(bb, cc, dd, aa, x[i + 4], s[23], k[23]);
          aa = GG(aa, bb, cc, dd, x[i + 9], s[24], k[24]);
          dd = GG(dd, aa, bb, cc, x[i + 14], s[25], k[25]);
          cc = GG(cc, dd, aa, bb, x[i + 3], s[26], k[26]);
          bb = GG(bb, cc, dd, aa, x[i + 8], s[27], k[27]);
          aa = GG(aa, bb, cc, dd, x[i + 13], s[28], k[28]);
          dd = GG(dd, aa, bb, cc, x[i + 2], s[29], k[29]);
          cc = GG(cc, dd, aa, bb, x[i + 7], s[30], k[30]);
          bb = GG(bb, cc, dd, aa, x[i + 12], s[31], k[31]);

          aa = HH(aa, bb, cc, dd, x[i + 5], s[32], k[32]);
          dd = HH(dd, aa, bb, cc, x[i + 8], s[33], k[33]);
          cc = HH(cc, dd, aa, bb, x[i + 11], s[34], k[34]);
          bb = HH(bb, cc, dd, aa, x[i + 14], s[35], k[35]);
          aa = HH(aa, bb, cc, dd, x[i + 1], s[36], k[36]);
          dd = HH(dd, aa, bb, cc, x[i + 4], s[37], k[37]);
          cc = HH(cc, dd, aa, bb, x[i + 7], s[38], k[38]);
          bb = HH(bb, cc, dd, aa, x[i + 10], s[39], k[39]);
          aa = HH(aa, bb, cc, dd, x[i + 13], s[40], k[40]);
          dd = HH(dd, aa, bb, cc, x[i + 0], s[41], k[41]);
          cc = HH(cc, dd, aa, bb, x[i + 3], s[42], k[42]);
          bb = HH(bb, cc, dd, aa, x[i + 6], s[43], k[43]);
          aa = HH(aa, bb, cc, dd, x[i + 9], s[44], k[44]);
          dd = HH(dd, aa, bb, cc, x[i + 12], s[45], k[45]);
          cc = HH(cc, dd, aa, bb, x[i + 15], s[46], k[46]);
          bb = HH(bb, cc, dd, aa, x[i + 2], s[47], k[47]);

          aa = II(aa, bb, cc, dd, x[i + 0], s[48], k[48]);
          dd = II(dd, aa, bb, cc, x[i + 7], s[49], k[49]);
          cc = II(cc, dd, aa, bb, x[i + 14], s[50], k[50]);
          bb = II(bb, cc, dd, aa, x[i + 5], s[51], k[51]);
          aa = II(aa, bb, cc, dd, x[i + 12], s[52], k[52]);
          dd = II(dd, aa, bb, cc, x[i + 3], s[53], k[53]);
          cc = II(cc, dd, aa, bb, x[i + 10], s[54], k[54]);
          bb = II(bb, cc, dd, aa, x[i + 1], s[55], k[55]);
          aa = II(aa, bb, cc, dd, x[i + 8], s[56], k[56]);
          dd = II(dd, aa, bb, cc, x[i + 15], s[57], k[57]);
          cc = II(cc, dd, aa, bb, x[i + 6], s[58], k[58]);
          bb = II(bb, cc, dd, aa, x[i + 13], s[59], k[59]);
          aa = II(aa, bb, cc, dd, x[i + 4], s[60], k[60]);
          dd = II(dd, aa, bb, cc, x[i + 11], s[61], k[61]);
          cc = II(cc, dd, aa, bb, x[i + 2], s[62], k[62]);
          bb = II(bb, cc, dd, aa, x[i + 9], s[63], k[63]);

          a = AddUnsigned(a, aa);
          b = AddUnsigned(b, bb);
          c = AddUnsigned(c, cc);
          d = AddUnsigned(d, dd);
        }

        return WordToHex(a) + WordToHex(b) + WordToHex(c) + WordToHex(d);
      }

      // Base64编码解码工具
      function base64Encode() {
        const input = document.getElementById('base64-input').value;
        const result = document.getElementById('base64-result');
        result.textContent = btoa(unescape(encodeURIComponent(input)));
        result.style.color = '#333';
      }

      function base64Decode() {
        const input = document.getElementById('base64-input').value;
        const result = document.getElementById('base64-result');
        const langData = i18n[currentLang];
        try {
          result.textContent = decodeURIComponent(escape(atob(input)));

      // 时间戳转换工具
      function timestampToDate() {
        const input = document.getElementById('timestamp-input').value;
        const result = document.getElementById('timestamp-result');
        const langData = i18n[currentLang];
        
        try {
          let timestamp = parseInt(input);
          // 如果是10位时间戳，转换为13位
          if (input.length === 10) {
            timestamp *= 1000;
          }
          
          const date = new Date(timestamp);
          if (isNaN(date.getTime())) {
            throw new Error(langData.invalidTimestamp);
          }
          
          // 根据当前语言设置日期格式
          const locale = currentLang === 'zh' ? 'zh-CN' : currentLang === 'ja' ? 'ja-JP' : 'en-US';
          const formatted = date.toLocaleString(locale, {
            year: 'numeric',
            month: '2-digit',
            day: '2-digit',
            hour: '2-digit',
            minute: '2-digit',
            second: '2-digit',
            hour12: false
          });
          
          result.textContent = formatted;
          result.style.color = '#333';
        } catch (e) {
          result.textContent = langData.conversionFailed + e.message;
          result.style.color = '#f2777a';
        }
      }

      function dateToTimestamp() {
        const input = document.getElementById('timestamp-input').value;
        const result = document.getElementById('timestamp-result');
        const langData = i18n[currentLang];
        
        try {
          const date = new Date(input);
          if (isNaN(date.getTime())) {
            throw new Error(langData.invalidDateFormat);
          }
          
          const timestamp = Math.floor(date.getTime() / 1000); // 转换为10位时间戳
          result.textContent = timestamp;
          result.style.color = '#333';
        } catch (e) {
          result.textContent = langData.conversionFailed + e.message;
          result.style.color = '#f2777a';
        }
      }

      // 颜色转换工具
      function hexToRgb() {
        const input = document.getElementById('color-input').value;
        const result = document.getElementById('color-result');
        const langData = i18n[currentLang];
        
        try {
          // 移除#号
          let hex = input.replace('#', '');
          
          // 处理3位十六进制颜色
          if (hex.length === 3) {
            hex = hex.split('').map(c => c + c).join('');
          }
          
          if (!/^[0-9A-Fa-f]{6}$/.test(hex)) {
            throw new Error(langData.invalidHexColor);
          }
          
          const r = parseInt(hex.substring(0, 2), 16);
          const g = parseInt(hex.substring(2, 4), 16);
          const b = parseInt(hex.substring(4, 6), 16);
          
          result.textContent = `rgb(${r}, ${g}, ${b})`;
          result.style.color = '#333';
        } catch (e) {
          result.textContent = langData.conversionFailed + e.message;
          result.style.color = '#f2777a';
        }
      }

      function rgbToHex() {
        const input = document.getElementById('color-input').value;
        const result = document.getElementById('color-result');
        const langData = i18n[currentLang];
        
        try {
          const match = input.match(/^rgb\((\d+),\s*(\d+),\s*(\d+)\)$/);
          if (!match) {
            throw new Error(langData.invalidRgbColor);
          }
          
          const r = parseInt(match[1]);
          const g = parseInt(match[2]);
          const b = parseInt(match[3]);
          
          if (r < 0 || r > 255 || g < 0 || g > 255 || b < 0 || b > 255) {
            throw new Error(langData.rgbRangeError);
          }
          
          const toHex = (n) => {
            const hex = n.toString(16);
            return hex.length === 1 ? '0' + hex : hex;
          };
          
          const hex = `#${toHex(r)}${toHex(g)}${toHex(b)}`.toUpperCase();
          result.textContent = hex;
          result.style.color = '#333';
        } catch (e) {
          result.textContent = langData.conversionFailed + e.message;
          result.style.color = '#f2777a';
        }
      }

      // 添加crypto-js库支持AES加密解密
      const script = document.createElement('script');
      script.src = 'https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js';
      document.head.appendChild(script);

      // AES加密解密工具
      function aesEncrypt() {
        const input = document.getElementById('aes-input').value;
        const key = document.getElementById('aes-key').value;
        const mode = document.getElementById('aes-mode').value;
        const result = document.getElementById('aes-result');
        const langData = i18n[currentLang];
        
        if (!key || (key.length !== 16 && key.length !== 24 && key.length !== 32)) {
          result.textContent = langData.aesKeyLengthError;
          result.style.color = '#f2777a';
          return;
        }
        
        try {
          if (typeof CryptoJS === 'undefined') {
            result.textContent = langData.loadingEncryptLibrary;
            result.style.color = '#333';
            setTimeout(aesEncrypt, 100);
            return;
          }
          
          const keyHex = CryptoJS.enc.Utf8.parse(key);
          const ivHex = CryptoJS.enc.Utf8.parse(key.substring(0, 16)); // 使用密钥前16位作为IV
          const encrypted = CryptoJS.AES.encrypt(input, keyHex, {
            iv: ivHex,
            mode: mode === 'CBC' ? CryptoJS.mode.CBC : CryptoJS.mode.ECB,
            padding: CryptoJS.pad.Pkcs7
          });
          
          result.textContent = encrypted.toString();
          result.style.color = '#333';
        } catch (e) {
          result.textContent = langData.encryptFailed + e.message;
          result.style.color = '#f2777a';
        }
      }

      function aesDecrypt() {
        const input = document.getElementById('aes-input').value;
        const key = document.getElementById('aes-key').value;
        const mode = document.getElementById('aes-mode').value;
        const result = document.getElementById('aes-result');
        const langData = i18n[currentLang];
        
        if (!key || (key.length !== 16 && key.length !== 24 && key.length !== 32)) {
          result.textContent = langData.aesKeyLengthError;
          result.style.color = '#f2777a';
          return;
        }
        
        try {
          if (typeof CryptoJS === 'undefined') {
            result.textContent = langData.loadingEncryptLibrary;
            result.style.color = '#333';
            setTimeout(aesDecrypt, 100);
            return;
          }
          
          const keyHex = CryptoJS.enc.Utf8.parse(key);
          const ivHex = CryptoJS.enc.Utf8.parse(key.substring(0, 16)); // 使用密钥前16位作为IV
          const decrypted = CryptoJS.AES.decrypt(input, keyHex, {
            iv: ivHex,
            mode: mode === 'CBC' ? CryptoJS.mode.CBC : CryptoJS.mode.ECB,
            padding: CryptoJS.pad.Pkcs7
          });
          
          result.textContent = decrypted.toString(CryptoJS.enc.Utf8);
          result.style.color = '#333';
        } catch (e) {
          result.textContent = langData.decryptFailed + e.message;
          result.style.color = '#f2777a';
        }
      }

      // 复制结果功能
      function copyResult(elementId) {
        const result = document.getElementById(elementId);
        const textarea = document.createElement('textarea');
        textarea.value = result.textContent;
        document.body.appendChild(textarea);
        textarea.select();
        document.execCommand('copy');
        document.body.removeChild(textarea);
        
        // 显示复制成功提示
        const originalText = result.textContent;
        const langData = i18n[currentLang];
        result.textContent = langData.copySuccess;
        result.style.color = '#5cb85c';
        setTimeout(() => {
          result.textContent = originalText;
          result.style.color = '#333';
        }, 2000);
      }
