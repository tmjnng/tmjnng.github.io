<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>开发工具集</title>
  <style>
    .tool-container {
      margin: 50px 0;
    }
    .tool-header {
      text-align: center;
      margin-bottom: 30px;
    }
    .tool-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
      margin: 0 20px;
    }
    .tool-card {
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      padding: 20px;
    }
    .tool-card textarea {
      width: 100%;
      min-height: 120px;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-family: monospace;
      resize: vertical;
      margin-bottom: 10px;
    }
    .tool-buttons {
      display: flex;
      gap: 10px;
      margin-bottom: 10px;
    }
    .tool-buttons button {
      flex: 1;
      padding: 10px;
      background: #258fb8;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    .tool-result {
      background: #f5f5f5;
      border: 1px solid #ddd;
      border-radius: 4px;
      padding: 10px;
      min-height: 80px;
      font-family: monospace;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <div class="tool-container">
    <div class="tool-header">
      <h1>开发工具集</h1>
      <p>提供常用开发工具</p>
    </div>
    <div class="tool-grid">
      <!-- JSON格式化工具 -->
      <div class="tool-card">
        <h3>JSON格式化</h3>
        <textarea id="json-input" placeholder="请输入JSON字符串..."></textarea>
        <div class="tool-buttons">
          <button onclick="formatJson()">格式化</button>
          <button onclick="minifyJson()">压缩</button>
        </div>
        <div id="json-result" class="tool-result"></div>
      </div>

      <!-- SQL格式化工具 -->
      <div class="tool-card">
        <h3>SQL格式化</h3>
        <textarea id="sql-input" placeholder="请输入SQL查询语句..."></textarea>
        <div class="tool-buttons">
          <button onclick="formatSql()">格式化</button>
          <button onclick="minifySql()">压缩</button>
        </div>
        <div id="sql-result" class="tool-result"></div>
      </div>
    </div>
  </div>

  <script>
    // JSON格式化工具
    function formatJson() {
      const input = document.getElementById('json-input').value;
      const result = document.getElementById('json-result');
      try {
        const parsed = JSON.parse(input);
        result.textContent = JSON.stringify(parsed, null, 2);
        result.style.color = '#333';
      } catch (e) {
        result.textContent = 'JSON格式错误: ' + e.message;
        result.style.color = '#f2777a';
      }
    }

    function minifyJson() {
      const input = document.getElementById('json-input').value;
      const result = document.getElementById('json-result');
      try {
        const parsed = JSON.parse(input);
        result.textContent = JSON.stringify(parsed);
        result.style.color = '#333';
      } catch (e) {
        result.textContent = 'JSON格式错误: ' + e.message;
        result.style.color = '#f2777a';
      }
    }

    // SQL格式化工具
    function formatSql() {
      const input = document.getElementById('sql-input').value;
      const result = document.getElementById('sql-result');
      try {
        const formatted = sqlFormatter(input);
        result.textContent = formatted;
        result.style.color = '#333';
      } catch (e) {
        result.textContent = 'SQL格式错误: ' + e.message;
        result.style.color = '#f2777a';
      }
    }

    function minifySql() {
      const input = document.getElementById('sql-input').value;
      const result = document.getElementById('sql-result');
      try {
        const minified = sqlMinifier(input);
        result.textContent = minified;
        result.style.color = '#333';
      } catch (e) {
        result.textContent = 'SQL格式错误: ' + e.message;
        result.style.color = '#f2777a';
      }
    }

    function sqlFormatter(sql) {
      sql = sql.trim();
      sql = sql.replace(/\s+/g, ' ');
      
      const keywords = ['SELECT', 'FROM', 'WHERE', 'AND', 'OR', 'JOIN', 'ORDER BY'];
      
      let formatted = sql;
      
      for (const keyword of keywords) {
        const regex = new RegExp('\\b' + keyword + '\\b', 'gi');
        formatted = formatted.replace(regex, (match) => '\n' + match.toUpperCase());
      }
      
      formatted = formatted.replace(/,/g, ',\n');
      formatted = formatted.replace(/\n+/g, '\n');
      
      return formatted.trim();
    }

    function sqlMinifier(sql) {
      sql = sql.replace(/--.*$/gm, '');
      sql = sql.replace(/\/\*[\s\S]*?\*\//g, '');
      sql = sql.trim();
      sql = sql.replace(/\s+/g, ' ');
      return sql;
    }
  </script>
</body>
</html>
