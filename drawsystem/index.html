<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>抽奖系统</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>抽奖系统</h1>
            <div class="header-actions">
                <button id="btn-reset" class="btn btn-danger">重置所有数据</button>
                <button id="btn-sample" class="btn btn-success" onclick="drawSystem.importAllSamples()">一键导入示例</button>
            </div>
        </header>

        <div class="main-content">
            <div class="left-panel">
                <section class="panel">
                    <div class="panel-header">
                        <h2>名单管理</h2>
                        <div class="panel-actions">
                            <input type="file" id="participant-file" accept=".json,.csv,.txt" style="display: none;">
                            <button class="btn btn-sm" onclick="document.getElementById('participant-file').click()">导入名单</button>
                            <button class="btn btn-sm" onclick="drawSystem.exportSampleParticipant()">示例</button>
                            <button class="btn btn-sm btn-success" onclick="drawSystem.addParticipant()">添加名单</button>
                        </div>
                    </div>
                    <div class="panel-body">
                        <div class="stats">
                            <span>总人数: <strong id="participant-count">0</strong></span>
                            <span>已中奖: <strong id="winner-count">0</strong></span>
                            <span>剩余: <strong id="remaining-count">0</strong></span>
                        </div>
                        <div id="participant-list" class="list-container"></div>
                    </div>
                </section>

                <section class="panel">
                    <div class="panel-header">
                        <h2>奖品级别</h2>
                        <div class="panel-actions">
                            <input type="file" id="prize-level-file" accept=".json" style="display: none;">
                            <button class="btn btn-sm" onclick="document.getElementById('prize-level-file').click()">导入级别</button>
                            <button class="btn btn-sm" onclick="drawSystem.exportSamplePrizeLevel()">示例</button>
                            <button class="btn btn-sm btn-success" onclick="drawSystem.addPrizeLevel()">添加级别</button>
                        </div>
                    </div>
                    <div class="panel-body">
                        <div id="prize-level-list" class="list-container"></div>
                    </div>
                </section>

                <section class="panel">
                    <div class="panel-header">
                        <h2>奖品管理</h2>
                        <div class="panel-actions">
                            <input type="file" id="prize-file" accept=".json,.csv,.txt" style="display: none;">
                            <button class="btn btn-sm" onclick="document.getElementById('prize-file').click()">导入奖品</button>
                            <button class="btn btn-sm" onclick="drawSystem.exportSamplePrize()">示例</button>
                            <button class="btn btn-sm btn-success" onclick="drawSystem.addPrize()">添加奖品</button>
                        </div>
                    </div>
                    <div class="panel-body">
                        <div class="stats">
                            <span>总奖品: <strong id="prize-count">0</strong></span>
                            <span>已送出: <strong id="prize-given-count">0</strong></span>
                        </div>
                        <div id="prize-list" class="list-container"></div>
                    </div>
                </section>
            </div>

            <div class="center-panel">
                <section class="panel draw-panel">
                    <div class="panel-header">
                        <h2>抽奖区域</h2>
                    </div>
                    <div class="panel-body">
                        <div class="draw-controls">
                            <div class="form-group">
                                <label for="draw-level">选择奖品级别</label>
                                <select id="draw-level"></select>
                            </div>
                            <div class="form-group">
                                <label for="draw-count">抽取人数</label>
                                <input type="number" id="draw-count" value="1" min="1" max="100">
                            </div>
                            <button id="btn-draw" class="btn btn-primary btn-lg">开始抽奖</button>
                        </div>
                        <div id="draw-display" class="draw-display">
                            <div class="draw-placeholder">点击"开始抽奖"开始</div>
                        </div>
                    </div>
                </section>

                <section class="panel">
                    <div class="panel-header">
                        <h2>中奖记录</h2>
                        <div class="panel-actions">
                            <button class="btn btn-sm" onclick="drawSystem.exportResults()">导出结果</button>
                        </div>
                    </div>
                    <div class="panel-body">
                        <div id="winner-list" class="list-container"></div>
                    </div>
                </section>
            </div>
        </div>
    </div>

    <div id="modal-container"></div>

    <script src="js/app.js"></script>
</body>
</html>
