<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Database Designer - Web版数据库设计工具</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="app-container">
        <!-- 顶部工具栏 -->
        <header id="toolbar">
            <div class="toolbar-left">
                <h1>Database Designer</h1>
                <div class="toolbar-buttons">
                    <button id="btn-new">新建</button>
                    <button id="btn-save">保存</button>
                    <button id="btn-export">导出</button>
                    <button id="btn-import">导入</button>
                </div>
            </div>
            <div class="toolbar-right">
                <button id="btn-add-table">添加表</button>
                <button id="btn-add-field">添加字段</button>
                <button id="btn-add-relation">添加关系</button>
                <button id="btn-delete">删除</button>
            </div>
        </header>

        <!-- 主工作区域 -->
        <main id="workspace">
            <!-- 左侧面板 - 表列表 -->
            <aside id="table-list">
                <h3>表结构</h3>
                <div id="tables-container">
                    <!-- 表列表将通过JS动态生成 -->
                </div>
            </aside>

            <!-- 中央画布区域 -->
            <section id="canvas">
                <div id="canvas-container">
                    <!-- 表和关系将通过JS动态生成 -->
                </div>
            </section>

            <!-- 右侧面板 - 属性编辑 -->
            <aside id="property-panel">
                <h3>属性编辑</h3>
                <div id="property-content">
                    <p>选择一个表或字段进行编辑</p>
                </div>
            </aside>
        </main>
    </div>

    <!-- 模态框 - 表编辑 -->
    <div id="table-modal" class="modal">
        <div class="modal-content">
            <h3>编辑表</h3>
            <form id="table-form">
                <div class="form-group">
                    <label for="table-name">表名</label>
                    <input type="text" id="table-name" required>
                </div>
                <div class="form-group">
                    <label for="table-comment">注释</label>
                    <input type="text" id="table-comment">
                </div>
                <div class="form-actions">
                    <button type="button" class="btn-cancel">取消</button>
                    <button type="submit" class="btn-save">保存</button>
                </div>
            </form>
        </div>
    </div>

    <!-- 模态框 - 字段编辑 -->
    <div id="field-modal" class="modal">
        <div class="modal-content">
            <h3>编辑字段</h3>
            <form id="field-form">
                <div class="form-group">
                    <label for="field-name">字段名</label>
                    <input type="text" id="field-name" required>
                </div>
                <div class="form-group">
                    <label for="field-type">数据类型</label>
                    <select id="field-type" required>
                        <option value="INT">INT</option>
                        <option value="VARCHAR">VARCHAR</option>
                        <option value="TEXT">TEXT</option>
                        <option value="DATE">DATE</option>
                        <option value="DATETIME">DATETIME</option>
                        <option value="BOOLEAN">BOOLEAN</option>
                        <option value="FLOAT">FLOAT</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="field-length">长度</label>
                    <input type="text" id="field-length">
                </div>
                <div class="form-group">
                    <label for="field-default">默认值</label>
                    <input type="text" id="field-default">
                </div>
                <div class="form-group">
                    <label>
                        <input type="checkbox" id="field-null"> 允许为空
                    </label>
                </div>
                <div class="form-group">
                    <label>
                        <input type="checkbox" id="field-primary"> 主键
                    </label>
                </div>
                <div class="form-group">
                    <label>
                        <input type="checkbox" id="field-unique"> 唯一
                    </label>
                </div>
                <div class="form-group">
                    <label for="field-comment">注释</label>
                    <input type="text" id="field-comment">
                </div>
                <div class="form-actions">
                    <button type="button" class="btn-cancel">取消</button>
                    <button type="submit" class="btn-save">保存</button>
                </div>
            </form>
        </div>
    </div>

    <div id="export-modal" class="modal">
        <div class="modal-content">
            <h3>导出SQL</h3>
            <div class="form-group">
                <label for="db-type">数据库类型</label>
                <select id="db-type" required>
                    <option value="generic">通用SQL</option>
                    <option value="oracle">Oracle</option>
                    <option value="postgresql">PostgreSQL</option>
                    <option value="mysql">MySQL</option>
                    <option value="sqlserver">SQL Server</option>
                </select>
            </div>
            <div class="form-actions">
                <button type="button" class="btn-cancel" onclick="document.getElementById('export-modal').style.display='none'">取消</button>
                <button type="button" class="btn-save" onclick="designer.exportAsSQL()">导出</button>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script src="js/table.js"></script>
    <script src="js/relation.js"></script>
    <script src="js/export.js"></script>
</body>
</html>
